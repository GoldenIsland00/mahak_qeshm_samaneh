{% extends 'base.html' %}
{% block title %}پروفایل | افیلیت پرو{% endblock %}
{% block content %}
<div class="max-w-md mx-auto animate-fade">
    <div class="glass-card p-6">
        <h1 class="text-xl font-bold mb-6">ویرایش پروفایل</h1>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm opacity-70 mb-1">نام</label>
                <input type="text" name="first_name" value="{{ user.first_name }}" class="w-full bg-white/10 border border-white/15 rounded-xl px-4 py-3 outline-none">
            </div>
            <div>
                <label class="block text-sm opacity-70 mb-1">نام خانوادگی</label>
                <input type="text" name="last_name" value="{{ user.last_name }}" class="w-full bg-white/10 border border-white/15 rounded-xl px-4 py-3 outline-none">
            </div>
            <div>
                <label class="block text-sm opacity-70 mb-1">ایمیل</label>
                <input type="email" name="email" value="{{ user.email }}" class="w-full bg-white/10 border border-white/15 rounded-xl px-4 py-3 outline-none">
            </div>
            <div>
                <label class="block text-sm opacity-70 mb-1">موبایل</label>
                <input type="text" name="phone" value="{{ profile.phone }}" class="w-full bg-white/10 border border-white/15 rounded-xl px-4 py-3 outline-none">
            </div>
            <div>
                <label class="block text-sm opacity-70 mb-1">صنف کاری</label>
                <input type="text" name="job_class" value="{{ profile.job_class }}" class="w-full bg-white/10 border border-white/15 rounded-xl px-4 py-3 outline-none" placeholder="مثلاً پوشاک، لوازم خانگی ...">
            </div>
            <div>
                <label class="block text-sm opacity-70 mb-1">شماره کارت</label>
                <input type="text" name="bank_card" value="{{ profile.bank_card }}" maxlength="16" class="w-full bg-white/10 border border-white/15 rounded-xl px-4 py-3 outline-none">
            </div>
            <button type="submit" class="w-full btn-primary py-3 rounded-xl font-bold">ذخیره تغییرات</button>
        </form>
    </div>
</div>
{% endblock %}
