{% extends 'base.html' %}
{% block title %}ثبت موفق | افیلیت پرو{% endblock %}
{% block content %}
<div class="max-w-md mx-auto animate-fade">
    <div class="glass-card p-8 md:p-10 text-center relative overflow-hidden">
        <div class="absolute -top-16 -right-16 w-40 h-40 bg-green-500/15 rounded-full blur-3xl pointer-events-none"></div>
        <div class="relative w-20 h-20 mx-auto rounded-full bg-green-500/20 border border-green-400/30 flex items-center justify-center text-4xl mb-5">
            ✓
        </div>
        <h1 class="text-2xl font-bold text-green-400 mb-3">بسته شما ثبت شد</h1>
        <p class="opacity-65 leading-relaxed mb-2">
            ممنون از ثبت اطلاعات.
        </p>
        <p class="opacity-55 text-sm leading-relaxed mb-7">
            وضعیت شما «بررسی‌نشده» است. تیم ما به زودی بررسی می‌کند و در صورت نیاز با شما تماس می‌گیرد.
        </p>
        <div class="flex flex-col gap-3">
            <a href="{% url 'home' %}" class="btn-primary py-3.5 rounded-xl font-bold">
                بازگشت به صفحه اصلی
            </a>
            <a href="{% url 'packages' %}" class="glass py-3 rounded-xl font-medium hover:bg-white/10 transition">
                مشاهده بسته‌ها
            </a>
        </div>
    </div>
</div>
{% endblock %}
